when:
  event: [push, manual]

# No build-test/test split like the app repos: there's no test suite to run
# against a "-test" tagged image here, so building the exact same thing
# twice under two names would just be wasted registry storage — the
# release build itself (rover compose failing = build failing) is the
# validation. Only builds on main.
#
# Tagged "latest" (not ${CI_COMMIT_SHA}) deliberately: this image's content
# depends on the backend's live schema at build time, not just this repo's
# own commit, so rebuilding the same commit can still produce different
# content that needs to redeploy. A commit-sha tag would make two builds of
# the same commit collide on one tag, which Image Updater's "latest"
# (newest-tag) strategy can't detect as a change — it already bit us once.
# Image Updater tracks this tag with "digest" strategy instead, which does
# detect a content change under a reused tag.
steps:
  build-release:
    image: docker.io/woodpeckerci/plugin-kaniko:latest@sha256:01e0e325efd8fd2b1a95d207e84780a85ed7f8eb9712d8e79888e0f42ff8b7b3
    settings:
      repo: graph-router
      registry: registry.morrisons.site
      dockerfile: Dockerfile
      target: release
      tags: latest
      username: ci
      password:
        from_secret: zot_password
    when:
      branch: main

  verify-deploy:
    image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    commands:
      - sh scripts/verify-deploy.sh
    when:
      branch: main
