supergraph:
  listen: 0.0.0.0:4000
  introspection: true
include_subgraph_errors:
  all: true
cors:
  policies:
    - origins:
        - https://hdmi-switch.morrisons.site
      methods:
        - GET
        - POST
        - OPTIONS
      allow_headers:
        - content-type
sandbox:
  enabled: true
homepage:
  enabled: false
health_check:
  listen: 0.0.0.0:8088
  enabled: true
